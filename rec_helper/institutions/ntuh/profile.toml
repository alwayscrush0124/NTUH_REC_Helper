# Institution profile — National Taiwan University Hospital, Research Ethics Committee.
# The application itself is filled in the REC web system (online.py → copy-paste
# sheets); attachments are filled on the official blanks (attachments.py).
id = "ntuh"
name = "國立臺灣大學醫學院附設醫院"
name_en = "National Taiwan University Hospital"
committee = "研究倫理委員會"
irb_no_label = "REC 案號"
ehr_name = "臺大醫院電子病歷系統"   # data source wording for chart reviews

# Python module exposing FORM_REGISTRY + PHASE_FORMS (DOCX attachments)
forms_module = "rec_helper.institutions.ntuh.forms"
# Python module exposing ONLINE_FORMS (pages of the REC web system)
online_module = "rec_helper.institutions.ntuh.online"

[submission]
web = "https://reg.ntuh.gov.tw/RECManageSystem/"   # 臺大醫院倫委會申請暨審查管理系統
paper = "新案申請書於行政審查後由線上系統列印，主持人及科/部主任簽章後掃描上傳"

# Manual steps listed in checklist.md, per phase
[checklist]
new = [
  "填完 e-REC 線上申請書（output/online/ 對照填寫單），研究領域、團隊帳號、審查費、利益申報在系統內完成",
  "上傳計畫書（註明版本日期）與 output/ 的 PDF 附件",
  "保密聲明切結書：主持人及每位研究人員各簽一份",
  "行政審查後：由系統列印新案申請書，主持人及科/部主任簽章後掃描上傳",
]
amendment = ["修正前後對照表逐項填寫修正前/後內容與原因", "上傳修正後文件（註明新版本日期）"]
continuing = ["填寫本期收案人數與退出人數", "上傳最近一位受試者簽署之同意書（遮蔽個資，保留簽署日期），免除同意者除外"]
closure = ["確認收案、退出人數與 SAE 件數", "已發表者上傳文獻電子檔"]
sae = ["依時效通報（藥品致死或危及生命：獲知 7 日內）", "上傳去識別化病歷摘要"]
deviation = ["獲知日起 15 個工作日內通報", "重大偏差附根本原因分析及改善報告（AF-161）"]

# Official blank attachments: 倫委會官網 → 表單下載
[templates]
# 表單下載 is split into one page per submission type (新案、變更、持續審查、結案、SAE、偏差、其他、免審、恩慈)
index_urls = [
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5011&fid=5529",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5012&fid=5530",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5013&fid=5531",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5014&fid=5532",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5015&fid=5533",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5016&fid=5534",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5017&fid=5535",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=5018&fid=5536",
  "https://www.ntuh.gov.tw/RECO/Fpage.action?muid=4637&fid=5065",
]
link_host = "direct"
form_id_pattern = 'AF-(\d{2,3})'
form_id_format = "AF{:03d}"

