# Page setup of the blanks (twips; 567 twips = 1 cm). Forms differ: map them
# per form in [page.per_form_margins] when onboarding.
[page]
width = 11906                  # A4
height = 16838
margins = { left = 1418, right = 1418, top = 1418, bottom = 1418 }
header_distance = 851
footer_distance = 992

[page.per_form_margins]        # [left, right, top, bottom] where a blank differs
AF001 = [1134, 1134, 907, 851]
AF164 = [1077, 1077, 1440, 1440]
MEDREC = [567, 567, 567, 567]

[font]
name = "標楷體"
aliases = ["DFKai-SB", "BiauKai"]   # Windows / macOS names of the same face
lang = "zh-TW"
encoding = "cp950"
